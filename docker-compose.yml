version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: swipehire_postgres
    environment:
      POSTGRES_USER: swipehire
      POSTGRES_PASSWORD: swipehire123
      POSTGRES_DB: swipehire
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swipehire"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: swipehire_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: swipehire_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: swipehire_meilisearch
    environment:
      MEILI_MASTER_KEY: "your_meilisearch_key"
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: swipehire_ai
    environment:
      DATABASE_URL: postgresql://swipehire:swipehire123@postgres:5432/swipehire
      REDIS_URL: redis://redis:6379
      QDRANT_URL: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/ai-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: swipehire_api
    environment:
      DATABASE_URL: postgresql://swipehire:swipehire123@postgres:5432/swipehire
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    volumes:
      - ./apps/api:/app
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  meilisearch_data:
