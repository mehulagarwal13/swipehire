name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Python AI Service ──────────────────────────────────────────────────────
  test-ai-service:
    name: Test AI Service (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: swipehire
          POSTGRES_PASSWORD: swipehire123
          POSTGRES_DB: swipehire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install deps
        working-directory: apps/ai-service
        run: |
          pip install -r requirements.txt --break-system-packages
          python -m spacy download en_core_web_sm

      - name: Lint (ruff)
        working-directory: apps/ai-service
        run: |
          pip install ruff --break-system-packages
          ruff check . --ignore E501

      - name: Type check (mypy)
        working-directory: apps/ai-service
        run: |
          pip install mypy --break-system-packages
          mypy . --ignore-missing-imports || true

      - name: Install test deps
        working-directory: apps/ai-service
        run: pip install pytest pytest-asyncio httpx aiosqlite --break-system-packages

      - name: Run unit + integration tests
        working-directory: apps/ai-service
        env:
          DATABASE_URL: postgresql+asyncpg://swipehire:swipehire123@localhost:5432/swipehire_test
          REDIS_URL: redis://localhost:6379
          DEBUG: "true"
        run: pytest tests/ -v --tb=short

  # ─── Next.js Web App ────────────────────────────────────────────────────────
  test-web:
    name: Test Web App (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install

      - name: Type check
        run: pnpm --filter @swipehire/web type-check

      - name: Lint
        run: pnpm --filter @swipehire/web lint

      - name: Build
        run: pnpm --filter @swipehire/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXTAUTH_SECRET: ci_secret_placeholder
          NEXTAUTH_URL: http://localhost:3000

      - name: Install Playwright
        run: pnpm --filter @swipehire/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm --filter @swipehire/web exec playwright test --project=chromium
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXTAUTH_SECRET: ci_secret_placeholder
          NEXTAUTH_URL: http://localhost:3000

  # ─── Docker build check ─────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-ai-service, test-web]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AI service image
        uses: docker/build-push-action@v5
        with:
          context: apps/ai-service
          push: false
          tags: swipehire-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
